[[mods]]
modId="tensura_prestige_fix"
version="1.0.0"
displayName="Tensura Prestige Fix"
displayTest="IGNORE_SERVER_VERSION"
authors="TensuraServerDev"
description='''
Fixes two critical Prestige issues in the Tensura: Reincarnated / SlimeThroneExtras / TRNightmare / FTB Quests stack:
1. Automatically resets FTB Quests progress, claimed rewards (both personal and team-shared), and repeat cooldowns when a player Prestiges, syncing immediately to the client.
2. Prevents TRNightmare's character-reset hooks from wiping earned Ultimate Skill Slots back to 1 on Prestige, while activating TRNightmare's dormant UltimateSlotHelper.onResetCounter scaling and optional bonus slots per Prestige.
'''

[[mixins]]
config="tensura_prestige_fix.mixins.json"

